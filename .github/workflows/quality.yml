# 품질·안정성 검사.
#
# build.yml 과 나누어 둔 이유: build.yml 은 "돌아가는가"를 보고, 이쪽은 "조용히 틀린 데가
# 없는가"를 본다. 둘을 섞으면 실패 원인을 읽기 어렵다.
#
# 잡을 잘게 쪼개지 않고 하나로 묶었고(잡마다 체크아웃·설치가 다시 돈다), 오래 걸리는 퍼징은
# 매 푸시가 아니라 주 1회와 수동으로만 돈다. 전부 ubuntu 다.
#
# 2026-11-17 저장소를 공개로 전환해 Actions 분 제한은 사라졌다(공개 저장소는 무료). 위 구성은
# 그대로 두었다 — 분을 아끼려고 한 것이지만 실패 원인을 읽기 쉬운 쪽이기도 하다.
name: quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 토요일 19:17 UTC = 일요일 04:17 KST. 퍼징 잡만 여기서 돈다.
    - cron: '17 19 * * 6'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # STATE 검사가 merge-base 를 구해야 해서 얕은 체크아웃으로는 안 된다(실제로 1회 실패했다).
      # fetch-depth: 0 은 173MB 전체를 매번 받으므로 100 으로 둔다 — PR 브랜치는 짧게 산다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      # --- 0. 문서 구조 (1초. 설치도 필요 없다) ---
      # 문서 규칙이 사람 손으로는 안 지켜졌다 — 목록이 세 곳에 갈라져 서로 달라졌고, 문서를 옮기면
      # 링크가 깨진 채 남았다. 기계가 잡을 수 있는 것만 검사한다(링크·색인·archive 역류·STATE 갱신).
      #
      # PR 에서는 STATE.md 갱신까지 본다. merge-base 가 필요해서 base 브랜치를 얕게 받아 온다.
      # 상태가 정말 안 바뀐 PR 은 커밋 메시지에 `State-Skip: <이유>` 줄을 넣는다.
      - name: 문서 링크·색인·STATE 검사
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q --depth=100 origin "${{ github.base_ref }}"
            python3 tools/check_docs.py --pr-base "origin/${{ github.base_ref }}"
          else
            python3 tools/check_docs.py
          fi

      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cppcheck clang clang-tidy \
                                  libclang-rt-18-dev gcovr python3-pil

      # --- 1. Windows 코드 문법 검사 (제일 먼저. 10초쯤이고, 여기서 걸리면 뒤를 볼 필요가 없다) ---
      # build.yml 의 windows 잡은 몇 분이 걸리고 분도 2배다. 같은 실수를 여기서 먼저 잡는다.
      - name: src/win 교차 컴파일
        run: tools/check_win_build.sh --link

      # 실행 파일만 올리면 받은 사람이 켰을 때 그림이 하나도 안 나온다(assets 를 읽지 못함).
      # 그래서 게임이 실제로 읽는 assets 를 옆에 붙여 "받아서 바로 켜는" 묶음으로 올린다.
      # assets/references 는 작업용 원본(일부는 LFS 포인터)이라 뺀다.
      - name: 실행 묶음 만들기 (실행 파일 + assets)
        run: |
          mkdir -p dist/play/DragonTower
          cp dist/win-local/dragon_tower.exe dist/play/DragonTower/
          cp -r assets dist/play/DragonTower/assets
          rm -rf dist/play/DragonTower/assets/references
          cp README.md dist/play/DragonTower/

      # 저장 공간 절약: PR 쪽에서는 올리지 않고 3일만 보관한다(build.yml 주석 참고).
      # 저장 공간이 가득 차면 이 단계만 실패하는데, 그러면 빌드·테스트가 다 통과했는데도
      # main 이 빨갛게 된다(2026-11-16 실제로 그랬다). 업로드 실패는 코드 문제가 아니므로
      # 검사 결과를 가리지 않게 한다. 묶음이 필요하면 공간을 비우고 다시 돌린다.
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # 저장 공간이 차도 검사 결과를 가리지 않는다
        if: github.event_name != 'pull_request'
        with:
          name: dragon-tower-mingw-play
          path: dist/play/DragonTower
          if-no-files-found: error
          retention-days: 3

      # --- 2. 새니타이저 (ASan + UBSan) ---
      # 테스트가 "통과"해도 그 안에서 메모리를 잘못 건드리고 있을 수 있다.
      # 실제로 이걸 켜서 보스 2페이즈 소환의 use-after-free 를 찾았다.
      - name: 새니타이저로 코어 테스트
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build build-asan -j
          cd build-asan
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
            ctest --output-on-failure
          # 테스트가 밟지 않는 전투·탑 경로까지 훑는다
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
            ./balance_sim floors --trials=20 --seed=1 > /dev/null

      # --- 3. 정적 분석 (기준선과 비교. 새 지적만 막는다) ---
      - name: cppcheck + clang-tidy
        run: |
          cmake -S . -B build-cc -DCMAKE_EXPORT_COMPILE_COMMANDS=ON > /dev/null
          python3 tools/check_static.py --build-dir build-cc

      # --- 3.5 코퍼스가 커지지 않았는지 (저장소 오염 막기) ---
      # 2026-11-14·15에 libFuzzer 가 저장소 코퍼스 폴더에 쓴 입력이 두 번 커밋됐다.
      # 문서로 적는 것만으로는 안 막혀서 검사로 만들었다.
      - name: 퍼저 코퍼스 크기
        run: tests/fuzz/check_corpus_size.sh

      # --- 4. 스프라이트 시트 (격자 나누기 + 크기) ---
      - name: 시트 검사
        run: python3 tools/check_sheets.py --out sheet-contact.png

      - uses: actions/upload-artifact@v4
        continue-on-error: true  # 저장 공간이 차도 검사 결과를 가리지 않는다
        if: always()
        with:
          name: sheet-contact-sheet
          path: sheet-contact.png
          if-no-files-found: warn
          retention-days: 7

      # --- 5. 커버리지 (막지는 않고 숫자만 남긴다) ---
      - name: 커버리지
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="--coverage -O0" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build-cov -j
          (cd build-cov && ctest > /dev/null 2>&1 || true; ./balance_sim > /dev/null 2>&1 || true)
          gcovr --root . --filter 'src/core/' --filter 'include/core/' \
                --txt --sort uncovered-number build-cov | tee coverage.txt
          echo '### 코어 커버리지' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -4 coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # 퍼징은 비싸고 오래 걸린다. 매 푸시가 아니라 주 1회(일요일 새벽)와 수동으로만 돈다.
  # 찾은 입력은 캐시에 쌓여 다음 회차가 그 지점에서 이어 간다.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_dragon_text, fuzz_enemy_text, fuzz_save_roundtrip, fuzz_tower_text]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev

      - name: 지난 회차 코퍼스 가져오기
        uses: actions/cache@v4
        with:
          path: .fuzz-corpus/${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-

      - name: 빌드와 실행
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=clang++ -DDRAGON_BUILD_FUZZERS=ON
          cmake --build build-fuzz -j --target ${{ matrix.target }}
          mkdir -p .fuzz-corpus/${{ matrix.target }} crashes
          cp tests/fuzz/corpus/${{ matrix.target }}/* .fuzz-corpus/${{ matrix.target }}/ || true
          ./build-fuzz/${{ matrix.target }} \
              -max_total_time=600 -max_len=4096 \
              -artifact_prefix=crashes/ \
              .fuzz-corpus/${{ matrix.target }}

      - name: 찾은 입력 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # 저장 공간이 차도 검사 결과를 가리지 않는다
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crashes/
          if-no-files-found: ignore
