name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/DragonTower | Out-Null
          Copy-Item build/Release/dragon_tower.exe dist/DragonTower/
          Copy-Item -Recurse assets dist/DragonTower/assets
          Copy-Item README.md dist/DragonTower/

      # 비공개 저장소는 Actions 저장 공간이 작다(2026-11-16 가득 차서 업로드가 실패했다).
      # 같은 커밋이 push·pull_request 로 두 번 돌기 때문에 PR 쪽에서는 올리지 않고(push 쪽 묶음을 받으면 된다),
      # 보관은 3일만 한다. 받을 묶음이 없어지면 워크플로를 다시 돌리면 된다.
      # 저장 공간이 가득 차면 이 단계만 실패하는데, 그러면 빌드·테스트가 다 통과했는데도
      # main 이 빨갛게 된다(2026-11-16 실제로 그랬다). 업로드 실패는 코드 문제가 아니므로
      # 검사 결과를 가리지 않게 한다. 묶음이 필요하면 공간을 비우고 다시 돌린다.
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # 저장 공간이 차도 검사 결과를 가리지 않는다
        if: github.event_name != 'pull_request'
        with:
          name: DragonTower-windows
          path: dist/DragonTower
          retention-days: 3

  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test core rules
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure
